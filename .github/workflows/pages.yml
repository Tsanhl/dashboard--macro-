name: Build and publish site

on:
  schedule:
    - cron: "30 5 * * 2-6"  # 05:30 UTC, Tue–Sat, after each US session (06:30 UK summer time)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "build_data.py", "build_site.py", "flows.py", "alerts.py", "summary_checks.py", "daily_summary.py", "daily_facts.py", "summary.md", "tests/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check dated comparisons and public data boundary
        run: python -m unittest discover -s tests -v
      - name: Build data (one retry if a source times out)
        run: python build_data.py || (sleep 60 && python build_data.py)
      - run: python build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
